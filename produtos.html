<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Produtos</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: #712121;
        }

        body {
            display: flex;
            display: flex;
            align-items: center;
        }
        section {
            display: flex;
            justify-content: left space-between;
            align-items: center;
            gap: 20px;
            margin-top: 7px;
        }
        section a{
            text-decoration: none;
            color: black;
            font-weight: bolder;
            text-align: center;
            border: 2px solid #712121;
            padding: 5px;
        }

        section p {
            text-transform: uppercase;
            font-size: 10px;
        }

        section img {
            width: 50px;
        }

        section a:hover {
            border: 2px solid white;
            color: white;
        }
        section > a > p {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <section class="instrumentos">
        <a href="#">
            <img src="imagens/instrumentos.png" alt="Instrumentos Musicais">
            <p>Instrumentos Musicais</p>
        </a>
        <a href="#">
            <img src="imagens/cordas.png" alt="Cordas">
            <p>Cordas</p>
        </a>
        <a href="#">
            <img src="imagens/microfone.png" alt="Microfone e Studio">
            <p>Microfone e Studio</p>
        </a>
        <a href="#">
            <img src="imagens/pedal.png" alt="Pedais e Pedaleiras">
            <p>Pedais e Pedaleiras</p>
        </a>
        <a href="#">
            <img src="imagens/amplificadores.png" alt="Amplificadores">
            <p>Amplificadores</p>
        </a>
        <a href="#">
            <img src="imagens/acessorios.png" alt="Acesórios">
            <p>Acesórios</p>
        </a>
        <a href="#">
            <img src="imagens/vip.png" alt="Produtos Sob Encomenda">
            <p>Produtos Sob Encomenda</p>
        </a>
    </section>
</body>
</html>
