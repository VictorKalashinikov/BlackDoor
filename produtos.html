<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Produtos</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #712121;
    overflow: hidden;
}

.categorias-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

.instrumentos {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    align-items: center;
    gap: 20px;

    width: max-content;
    padding: 7px 10px;
}

.instrumentos a {
    flex-shrink: 0;

    text-decoration: none;
    color: black;
    font-weight: bolder;
    text-align: center;

    border: 2px solid #712121;
    padding: 5px;
}

.instrumentos p {
    text-transform: uppercase;
    font-size: 10px;
}

.instrumentos img {
    width: 50px;
    display: block;
    margin: auto;
}

.instrumentos a:hover {
    border: 2px solid white;
    color: white;
}

.instrumentos > a > p {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="categorias-scroll">
        <section class="instrumentos">
            <a href="#">
                <img src="imagens/instrumentos.png" alt="Instrumentos Musicais">
                <p>Instrumentos Musicais</p>
            </a>

            <a href="#">
                <img src="imagens/cordas.png" alt="Cordas">
                <p>Cordas</p>
            </a>

            <a href="#">
                <img src="imagens/microfone.png" alt="Microfone e Studio">
                <p>Microfone e Studio</p>
            </a>

            <a href="#">
                <img src="imagens/pedal.png" alt="Pedais e Pedaleiras">
                <p>Pedais e Pedaleiras</p>
            </a>

            <a href="#">
                <img src="imagens/amplificadores.png" alt="Amplificadores">
                <p>Amplificadores</p>
            </a>

            <a href="#">
                <img src="imagens/acessorios.png" alt="Acesórios">
                <p>Acesórios</p>
            </a>

            <a href="#">
                <img src="imagens/vip.png" alt="Produtos Sob Encomenda">
                <p>Produtos Sob Encomenda</p>
            </a>
        </section>
    </div>
</body>
</html>
